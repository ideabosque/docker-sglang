services:
  sglang:
    image: lmsysorg/sglang:${SGLANG_IMAGE_TAG:-latest}
    container_name: container-sglang
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-30000}:30000"
    volumes:
      - ${MODELS_DIR:-./models}:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-1}
    shm_size: "32g"
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      python3 -m sglang.launch_server
      --model-path ${MODEL_ID}
      --host 0.0.0.0
      --port 30000
      --tp ${TP_SIZE:-1}
      --dtype ${DTYPE:-auto}
      --mem-fraction-static ${MEM_FRACTION_STATIC:-0.88}
      --context-length ${CONTEXT_LENGTH:-8192}
      ${TOOL_CALL_PARSER:+--tool-call-parser} ${TOOL_CALL_PARSER:-}
      ${REASONING_PARSER:+--reasoning-parser} ${REASONING_PARSER:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:30000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
